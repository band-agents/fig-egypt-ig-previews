<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>FIG Egypt Brand Instagrams</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: four phones stacked down one quiet column; everything inside each phone behaves like the Instagram app. Single light look on purpose (Instagram's own light UI). */
:root{--ground:#e9e6e2;--bezel:#0d0d0e;--ig-bg:#fff;--ig-ink:#000;--ig-mute:#737373;--ig-line:#dbdbdb;--ig-btn:#efefef;--ig-blue:#0095f6;--ig-link:#00376b;--heart:#ff3040;
--ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:var(--ground);color:var(--ig-ink);font-family:var(--ui)}
.stack{display:flex;flex-direction:column;align-items:center;gap:72px;padding-block:64px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{width:min(414px,100%);aspect-ratio:414/868;background:var(--bezel);border-radius:58px;padding:12px;box-shadow:0 40px 80px -30px rgba(40,30,20,.45),0 0 0 2px #2a2a2c inset;position:relative;max-width:100%}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--ig-bg);display:flex;flex-direction:column;isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;border-radius:20px;background:#000;z-index:30}
.sb{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 38px;font-weight:600;font-size:15.5px;z-index:20;background:var(--ig-bg)}
.sb .r{display:flex;gap:6px;align-items:center}
.sb.dark{background:#000;color:#fff}.sb.dark svg{filter:invert(1)}
.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.view::-webkit-scrollbar{display:none}
.nav{height:78px;flex:none;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;border-top:1px solid var(--ig-line);background:var(--ig-bg);z-index:20}
.nav.dark{background:#000;border-color:#000;color:#fff}
.nav button,.ib{background:none;border:0;padding:0;cursor:pointer;color:inherit;display:grid;place-items:center}
.nav svg{width:26px;height:26px}.nav .me{width:28px;height:28px;border-radius:50%;object-fit:cover;outline:1.5px solid transparent;outline-offset:1px}
.nav .me.on{outline-color:#000}
button:focus-visible{outline:2px solid var(--ig-blue);outline-offset:2px}
/* profile */
.top{position:sticky;top:0;z-index:5;background:var(--ig-bg);display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px;height:44px}
.top .u{font-weight:700;font-size:21px;letter-spacing:-.2px}
.top .ic{display:flex;gap:22px}.top svg{width:25px;height:25px}
.head{display:flex;align-items:center;gap:24px;padding:4px 16px 12px}
.ring{width:92px;height:92px;flex:none;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);cursor:pointer;border:0}
.ring img{width:100%;height:100%;border-radius:50%;border:3px solid var(--ig-bg);display:block;object-fit:cover;background:#fff}
.stats{flex:1;display:flex;justify-content:space-around;text-align:center;font-size:13.5px;line-height:1.25}
.stats b{display:block;font-size:17px}
.bio{padding:0 16px 12px;line-height:1.36;font-size:13.5px;display:grid;gap:1px}
.bio .n{font-weight:600}.bio .c{color:var(--ig-mute)}.bio .l{color:var(--ig-link);font-weight:600}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 16px 14px}
.btns span{background:var(--ig-btn);border-radius:8px;text-align:center;font-weight:600;font-size:13.5px;padding:7px 0}
.btns span:first-child{background:var(--ig-blue);color:#fff}
.hls{display:flex;gap:14px;overflow-x:auto;padding:2px 16px 14px;scrollbar-width:none}
.hls::-webkit-scrollbar{display:none}
.hl{flex:none;width:66px;text-align:center;font-size:12px;display:grid;gap:5px;justify-items:center}
.hl i{width:64px;height:64px;border-radius:50%;padding:2px;border:1px solid var(--ig-line);display:block}
.hl img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.tabs{position:sticky;top:44px;z-index:4;background:var(--ig-bg);display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--ig-line)}
.tabs button{padding:10px 0 9px;border:0;border-bottom:1.5px solid transparent;color:var(--ig-mute);background:none;cursor:pointer;display:grid;place-items:center}
.tabs button.on{border-color:#000;color:#000}.tabs svg{width:24px;height:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{position:relative;aspect-ratio:3/4;background:#eee;overflow:hidden;cursor:pointer;border:0;padding:0;display:block;width:100%}
.tile.r916{aspect-ratio:9/16}
.tile img,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.tile:hover img{transform:scale(1.04)}
.tile .bdg{position:absolute;top:7px;right:7px;width:19px;height:19px;color:#fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.5));z-index:2}
.tile .vc{position:absolute;left:7px;bottom:6px;color:#fff;font-size:12.5px;font-weight:600;display:flex;gap:4px;align-items:center;text-shadow:0 0 3px rgba(0,0,0,.6);z-index:2}
.tile .vc svg{width:14px;height:14px}
.empty{padding:56px 32px;text-align:center;color:var(--ig-mute);display:grid;gap:10px;justify-items:center;font-size:14px}
.empty b{color:#000;font-size:22px;font-weight:800}
.empty i{width:62px;height:62px;border:2px solid #000;border-radius:50%;display:grid;place-items:center;color:#000}
.empty i svg{width:30px;height:30px}
/* feed */
.fbar{position:sticky;top:0;z-index:5;background:var(--ig-bg);display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:4px 8px 10px;text-align:center}
.fbar div{font-size:12px;color:var(--ig-mute);font-weight:600;line-height:1.2}.fbar div b{display:block;color:#000;font-size:16px}
.fbar svg{width:26px;height:26px}
.post{padding-bottom:14px}
.ph{display:flex;align-items:center;gap:10px;padding:8px 12px;font-weight:600;font-size:13.5px}
.ph img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--ig-line)}
.ph .dots{margin-left:auto;width:22px;height:22px}
.media{position:relative;aspect-ratio:4/5;background:#f2f2f2}
.slider{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab;user-select:none}
.slider::-webkit-scrollbar{display:none}
.slider.drag{scroll-snap-type:none;cursor:grabbing}
.slide{flex:none;width:100%;height:100%;scroll-snap-align:start;position:relative}
.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.count{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.66);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:12px;z-index:3;font-variant-numeric:tabular-nums}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.85);border:0;cursor:pointer;z-index:3;display:grid;place-items:center;opacity:0;transition:opacity .2s;color:#000}
.arr svg{width:16px;height:16px}
.media:hover .arr{opacity:1}.arr.l{left:10px}.arr.r{right:10px}.arr[hidden]{display:none}
.snd{position:absolute;right:12px;bottom:12px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.66);border:0;z-index:3;display:grid;place-items:center;cursor:pointer}
.snd svg{width:15px;height:15px}
.burst{position:absolute;left:50%;top:50%;width:96px;height:96px;transform:translate(-50%,-50%) scale(0);z-index:4;pointer-events:none;color:#fff;filter:drop-shadow(0 4px 12px rgba(0,0,0,.35))}
.burst.go{animation:burst .9s ease forwards}
@keyframes burst{15%{transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(.95)}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.acts{display:flex;align-items:center;gap:16px;padding:10px 12px 6px;position:relative}
.acts svg{width:25px;height:25px}.acts .sv{margin-left:auto}
.lk.on{color:var(--heart)}.lk.on svg{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.25)}}
.pdots{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.pdots i{width:6px;height:6px;border-radius:50%;background:#c7c7c7}.pdots i.on{background:var(--ig-blue)}
.meta{padding:0 12px;font-size:13.5px;line-height:1.4;display:grid;gap:3px;justify-items:start}
.meta .cap{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.meta .cap.open{display:block}.meta .more{color:var(--ig-mute);cursor:pointer;background:none;border:0;padding:0;font:inherit}
.meta .d{color:var(--ig-mute);font-size:12px}
/* reels */
.reels{background:#000;scroll-snap-type:y mandatory}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;color:#fff}
.reel video{width:100%;height:100%;object-fit:cover;display:block}
.reel .shade{position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none}
.reel .side{position:absolute;right:10px;bottom:22px;display:grid;gap:6px;justify-items:center;font-size:12px;font-weight:600}
.reel .side .ib{margin-top:12px}
.reel .side svg{width:27px;height:27px}
.reel .who{position:absolute;left:14px;right:64px;bottom:22px;display:grid;gap:8px;font-size:13.5px}
.reel .who .p{display:flex;align-items:center;gap:8px;font-weight:600}
.reel .who img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.reel .who .f{border:1px solid rgba(255,255,255,.7);border-radius:8px;padding:3px 10px;font-size:12.5px}
.reel .who .c{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.rtop{position:sticky;top:0;height:0;z-index:3;color:#fff}
.rtop>div{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font-weight:700;font-size:20px}
.rtop svg{width:26px;height:26px}
.reel .snd{bottom:auto;top:56px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:440px){.stack{gap:40px;padding-block:24px 40px}.phone{border-radius:48px;padding:9px}.screen{border-radius:40px}.head{gap:14px}.ring{width:80px;height:80px}}
</style>

function wire(el,b){
  const q=s=>el.querySelector(s),qa=s=>[...el.querySelectorAll(s)];

  let muted=true;
  const vids=qa('.feed video,.reels video'),vis=new Map();
  // only the videos on screen in the visible view play
  const sync=()=>vids.forEach(v=>{const on=!v.closest('.view').hidden&&vis.get(v);v.muted=muted;if(on){v.preload='auto';v.play().catch(()=>{})}else v.pause()});
  const io=new IntersectionObserver(es=>{for(const e of es)vis.set(e.target,e.intersectionRatio>.55);sync()},{threshold:[0,.55,1]});
  vids.forEach(v=>io.observe(v));

  qa('.snd').forEach(s=>s.onclick=e=>{e.stopPropagation();muted=!muted;qa('.snd').forEach(x=>x.innerHTML=muted?I.mute:I.sound);sync()});
  qa('.tabs button').forEach(t=>t.onclick=()=>{qa('.tabs button').forEach(x=>x.classList.toggle('on',x===t));qa('.pane').forEach(p=>p.hidden=p.dataset.p!==t.dataset.t)});
  const openReel=k=>{show(reels);const r=qa('.reel')[Math.max(0,k)];reels.scrollTop=r?r.offsetTop:0};
  qa('.pane[data-p="g"] .tile').forEach(t=>{
    const i=+t.dataset.i,p=DATA[b.id][i];
    t.onclick=()=>{if(isReel(p))openReel(qa('.reel').findIndex(r=>+r.dataset.i===i));else{show(feed);feed.scrollTop=qa('.post')[i].offsetTop-50}};
    const v=t.querySelector('video');
    if(v){t.onmouseenter=()=>{v.hidden=false;v.preload='auto';v.play().catch(()=>{})};t.onmouseleave=()=>{v.pause();v.hidden=true}}
  });
  qa('.pane[data-p="r"] .tile').forEach(t=>t.onclick=()=>openReel(+t.dataset.r));
  q('.ring').onclick=()=>openReel(0);
  qa('.bk').forEach(x=>x.onclick=()=>show(prof));
  qa('.nav [data-n="home"]').forEach(x=>x.onclick=()=>{if(!prof.hidden)prof.scrollTo({top:0,behavior:'smooth'});show(prof)});
  q('.nav [data-n="reels"]').onclick=()=>openReel(0);

  qa('.post').forEach(post=>{
    const sl=post.querySelector('.slider'),n=sl.children.length,cnt=post.querySelector('.count'),dots=[...post.querySelectorAll('.pdots i')],al=post.querySelector('.arr.l'),ar=post.querySelector('.arr.r');
    const cur=()=>Math.round(sl.scrollLeft/sl.clientWidth);
    const go=k=>sl.scrollTo({left:Math.max(0,Math.min(n-1,k))*sl.clientWidth,behavior:'smooth'});
    sl.addEventListener('scroll',()=>{const k=cur();if(cnt)cnt.textContent=`${k+1}/${n}`;dots.forEach((d,j)=>d.classList.toggle('on',j===k));if(al){al.hidden=k===0;ar.hidden=k===n-1}},{passive:true});
    if(al){al.onclick=()=>go(cur()-1);ar.onclick=()=>go(cur()+1)}
    let x0=null,s0=0,moved=0,lastTap=0;
    sl.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;x0=e.clientX;s0=sl.scrollLeft;moved=0;sl.classList.add('drag');sl.setPointerCapture(e.pointerId)});
